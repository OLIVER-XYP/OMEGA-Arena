<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Halite Arena — Agent 视图</title>
<link rel="stylesheet" href="/web/style.css">
</head>
<body>
<header>
  <h1>👤 Agent 视图：<span id="agent-name">…</span></h1>
  <nav><a href="/">← 主视图</a></nav>
</header>

<main>
  <section>
    <h2>操作</h2>
    <div class="row">
      <button id="btn-compile">① 编译 submit/</button>
      <select id="sel-opps" multiple size="6" style="min-width:260px"></select>
      <button id="btn-practice">② practice vs 所选对手</button>
      <span id="action-status" class="status"></span>
    </div>
    <p class="hint">① 先编译（看能否过 g++）；② 选对手（Ctrl 多选）后触发练习，对局在后台跑，完成后自动刷新。</p>
  </section>

  <section>
    <h2>最近反馈（last_game/）</h2>
    <pre id="fb-json" class="box"></pre>
  </section>

  <section>
    <h2>只读材料</h2>
    <div class="row" id="mat-buttons"></div>
    <iframe id="mat-frame" class="box" style="width:100%;height:420px"></iframe>
  </section>

  <section>
    <h2>练习历史</h2>
    <table id="tbl-hist"><thead><tr><th>run</th><th>摘要</th></tr></thead><tbody></tbody></table>
  </section>
</main>

<script src="/web/app.js"></script>
</body>
</html>
